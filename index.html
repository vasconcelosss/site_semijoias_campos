<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrine Semijoias</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* layout: sticky header (busca + categorias) sobre grade de cards; painel da loja abre como gaveta lateral */
:root{
  --bg:#EEEBE3; --surface:#FFFFFF; --surface-2:#F6F3EC;
  --ink:#201F1A; --ink-soft:#656055; --border:#D9D3C4;
  --accent:#0E5B49; --accent-ink:#FFFFFF; --accent-soft:#E1EDE7;
  --gold:#96722F; --danger:#A1402B; --danger-soft:#F3E1DC; --success:#2E7D4F;
  --radius:14px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15180F; --surface:#1D2117; --surface-2:#232A1C;
    --ink:#ECE8DC; --ink-soft:#A9A694; --border:#343B2A;
    --accent:#58CFA6; --accent-ink:#0B1410; --accent-soft:#1E3A30;
    --gold:#D7B35F; --danger:#E08870; --danger-soft:#3A2420; --success:#6FCB95;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15180F; --surface:#1D2117; --surface-2:#232A1C;
  --ink:#ECE8DC; --ink-soft:#A9A694; --border:#343B2A;
  --accent:#58CFA6; --accent-ink:#0B1410; --accent-soft:#1E3A30;
  --gold:#D7B35F; --danger:#E08870; --danger-soft:#3A2420; --success:#6FCB95;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif; text-wrap:balance;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:var(--accent);}
button{font-family:inherit; cursor:pointer;}
.wrap{max-width:1100px; margin:0 auto; padding-block:20px 60px;}

/* header */
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding-block:14px 10px; border-bottom:1px solid var(--border);
}
.title-row{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.title-row h1{font-size:1.5rem; font-weight:600; margin:0;}
.title-row .sub{color:var(--ink-soft); font-size:.85rem; margin-top:2px;}
.staff-btn{
  background:var(--surface-2); color:var(--ink); border:1px solid var(--border);
  border-radius:999px; padding:8px 16px; font-size:.85rem; font-weight:600; white-space:nowrap;
}
.staff-btn:hover{border-color:var(--accent);}
.search-row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
.search-row input{
  flex:1; min-width:0; background:var(--surface); color:var(--ink); border:1px solid var(--border);
  border-radius:10px; padding:10px 14px; font-size:.95rem;
}
.search-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}
.chips{display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
.chip{
  flex:none; background:var(--surface); border:1px solid var(--border); color:var(--ink-soft);
  border-radius:999px; padding:7px 14px; font-size:.82rem; font-weight:600; white-space:nowrap;
}
.chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.chip .n{opacity:.7; font-weight:500;}

/* grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin-top:20px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; text-align:left; padding:0; display:flex; flex-direction:column; min-width:0;
}
.card img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--surface-2);}
.card .info{padding:9px 11px 11px; display:flex; flex-direction:column; gap:3px;}
.card .code{font-size:.72rem; color:var(--ink-soft); letter-spacing:.02em;}
.card .price{font-size:1.02rem; font-weight:600; color:var(--gold);}
.empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}

/* modal */
.modal-bg{
  position:fixed; inset:0; background:rgba(10,12,8,.6); display:flex; align-items:center; justify-content:center;
  padding:16px; z-index:50;
}
.modal{
  background:var(--surface); border-radius:var(--radius); max-width:420px; width:100%;
  overflow:hidden; max-height:92vh; overflow-y:auto;
}
.modal img{width:100%; display:block; aspect-ratio:1/1; object-fit:cover;}
.modal .body{padding:18px;}
.modal .code-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.modal .code-row .code{font-size:1rem; font-weight:600;}
.copy-btn{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:4px 10px; font-size:.75rem; color:var(--ink-soft);}
.modal .price{font-size:1.5rem; font-weight:600; color:var(--gold); margin:4px 0 2px;}
.modal .cat{color:var(--ink-soft); font-size:.85rem;}
.modal .close{display:block; width:100%; margin-top:16px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px; font-weight:600;}

/* drawer */
.drawer-bg{position:fixed; inset:0; background:rgba(10,12,8,.5); z-index:40; display:none;}
.drawer-bg.open{display:block;}
.drawer{
  position:fixed; top:0; right:0; height:100%; width:min(420px,100%); background:var(--surface);
  z-index:41; transform:translateX(100%); transition:transform .25s ease; overflow-y:auto;
  padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 24px 18px;
  border-left:1px solid var(--border);
}
.drawer.open{transform:translateX(0);}
.drawer h2{font-size:1.2rem; margin:0 0 4px;}
.drawer .close-x{position:absolute; top:16px; right:16px; background:none; border:none; font-size:1.3rem; color:var(--ink-soft); line-height:1;}
.pin-pad{display:flex; flex-direction:column; align-items:center; gap:14px; padding:40px 10px;}
.pin-pad input{
  width:140px; text-align:center; font-size:1.4rem; letter-spacing:.3em; padding:10px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
}
.pin-pad button{background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:10px 24px; font-weight:600;}
.pin-err{color:var(--danger); font-size:.85rem; min-height:1.2em;}
.status-box{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px; font-size:.88rem; color:var(--ink-soft); margin:20px 0;}
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;}
.kpi{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px;}
.kpi .label{font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.kpi .val{font-size:1.15rem; font-weight:600; margin-top:2px;}
.stock-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
.stock-row img{width:42px; height:42px; border-radius:8px; object-fit:cover; flex:none;}
.stock-row .meta{flex:1; min-width:0;}
.stock-row .meta .code{font-size:.78rem; display:block;}
.stock-row .meta .qty{font-size:.72rem; color:var(--ink-soft);}
.stock-row .qty.zero{color:var(--danger);}
.sell-btn{background:var(--accent-soft); color:var(--accent); border:none; border-radius:8px; padding:7px 12px; font-size:.78rem; font-weight:700; flex:none;}
.sell-btn:disabled{opacity:.4; cursor:default;}
.pend-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border);}
.pend-row input{width:64px; padding:6px 8px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink);}
.pend-row button{background:var(--gold); color:#fff; border:none; border-radius:7px; padding:6px 10px; font-size:.76rem; font-weight:600;}
.sale-item{font-size:.8rem; padding:7px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; color:var(--ink-soft);}
.section-label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:22px 0 8px;}
[hidden]{display:none!important;}
.staff-link-btn{display:block; text-align:center; background:var(--accent); color:var(--accent-ink);
  border:none; border-radius:10px; padding:13px 18px; font-weight:600; text-decoration:none; margin-bottom:10px;}
.staff-link-btn.secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--border);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-row">
      <div>
        <h1>Vitrine Semijoias</h1>
        <div class="sub" id="countLabel">carregando peças…</div>
      </div>
      <button class="staff-btn" id="openStaff">Área da loja</button>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Buscar pelo código (ex: CL0001...)" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" hidden>Nenhuma peça encontrada com esse código ou categoria.</div>
</div>

<div class="modal-bg" id="modalBg" hidden>
  <div class="modal">
    <img id="modalImg" alt="">
    <div class="body">
      <div class="code-row">
        <span class="code mono" id="modalCode"></span>
        <button class="copy-btn" id="modalCopy">copiar código</button>
      </div>
      <div class="cat" id="modalCat"></div>
      <div class="price mono" id="modalPrice"></div>
      <button class="close" id="modalClose">Fechar</button>
    </div>
  </div>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer">
  <button class="close-x" id="closeDrawer">✕</button>
  <div id="drawerContent"></div>
</aside>

const CATEGORIES = [
  ["AN","Anéis"], ["BR","Brincos"], ["CH","Choker"], ["CJ","Conjuntos"],
  ["CL","Colares"], ["LT","Letras"], ["PL","Pulseiras"], ["RV","Riviera"], ["TR","Tornozeleira"]
];
const CAT_LABEL = Object.fromEntries(CATEGORIES.map(c=>[c[1],c[1]]));
const COMISSAO_PCT = 0.10;
const FORM_VENDA_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeIcd7gLlLpOGwH8De0vNsLvzKlQzXTJiVRH1w4_XqI9k5EMA/viewform";
const PAINEL_URL = ""; // preencher quando a planilha publica estiver pronta

function brl(v){ return "R$ " + v.toFixed(2).replace(".",","); }
function codeCat(codigo){ return codigo.slice(0,2); }

// ---------- public gallery ----------
let activeCat = "Todos";
let searchTerm = "";

function buildChips(){
  const wrap = document.getElementById("chips");
  const counts = {};
  CATALOG.forEach(it => counts[it.categoria] = (counts[it.categoria]||0)+1);
  const all = [["Todos", CATALOG.length]].concat(CATEGORIES.map(c=>[c[1], counts[c[1]]||0]).filter(c=>c[1]>0));
  wrap.innerHTML = all.map(([label,n]) =>
    `<button class="chip${label===activeCat?' active':''}" data-cat="${label}">${label} <span class="n">${n}</span></button>`
  ).join("");
  wrap.querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{ activeCat = btn.dataset.cat; buildChips(); renderGrid(); });
  });
}

function matches(item){
  const inCat = activeCat === "Todos" || item.categoria === activeCat;
  const term = searchTerm.trim().toUpperCase();
  const inSearch = !term || item.codigo.toUpperCase().includes(term);
  return inCat && inSearch;
}

function renderGrid(){
  const list = CATALOG.filter(matches);
  document.getElementById("countLabel").textContent = `${list.length} de ${CATALOG.length} peças`;
  const grid = document.getElementById("grid");
  document.getElementById("emptyState").hidden = list.length>0;
  grid.innerHTML = list.map(it => `
    <button class="card" data-codigo="${it.codigo}">
      <img src="${it.foto}" alt="${it.categoria} ${it.codigo}" loading="lazy">
      <div class="info">
        <span class="code mono">${it.codigo}</span>
        <span class="price mono">${brl(it.preco)}</span>
      </div>
    </button>
  `).join("");
  grid.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click", ()=> openModal(card.dataset.codigo));
  });
}

function openModal(codigo){
  const it = CATALOG.find(i=>i.codigo===codigo);
  if(!it) return;
  document.getElementById("modalImg").src = it.foto;
  document.getElementById("modalImg").alt = it.categoria+" "+it.codigo;
  document.getElementById("modalCode").textContent = it.codigo;
  document.getElementById("modalCat").textContent = it.categoria;
  document.getElementById("modalPrice").textContent = brl(it.preco);
  document.getElementById("modalBg").hidden = false;
}
document.getElementById("modalClose").addEventListener("click", ()=> document.getElementById("modalBg").hidden = true);
document.getElementById("modalBg").addEventListener("click", (e)=>{ if(e.target.id==="modalBg") document.getElementById("modalBg").hidden = true; });
document.getElementById("modalCopy").addEventListener("click", async ()=>{
  const code = document.getElementById("modalCode").textContent;
  const btn = document.getElementById("modalCopy");
  try{ await navigator.clipboard.writeText(code); btn.textContent = "copiado!"; }
  catch(e){
    const r = document.createRange(); r.selectNodeContents(document.getElementById("modalCode"));
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = "selecionado";
  }
  setTimeout(()=> btn.textContent = "copiar código", 1500);
});

document.getElementById("searchInput").addEventListener("input", (e)=>{ searchTerm = e.target.value; renderGrid(); });

buildChips();
renderGrid();

/* Deep link: #CODIGO na URL (usado pelo QR code da etiqueta) abre a peça direto. */
(function openFromDeepLink(){
  const raw = (location.hash || "").replace("#", "").trim().toUpperCase();
  if(raw && CATALOG.some(i=>i.codigo===raw)){
    openModal(raw);
  }
})();
window.addEventListener("hashchange", ()=>{
  const raw = (location.hash || "").replace("#", "").trim().toUpperCase();
  if(raw && CATALOG.some(i=>i.codigo===raw)) openModal(raw);
});

// ---------- staff drawer (versao estatica, sem claude.use) ----------
const drawer = document.getElementById("drawer");
const drawerBg = document.getElementById("drawerBg");
const drawerContent = document.getElementById("drawerContent");

function openDrawer(){
  drawer.classList.add("open"); drawerBg.classList.add("open");
  renderStaffPanel();
}
function closeDrawer(){ drawer.classList.remove("open"); drawerBg.classList.remove("open"); }
document.getElementById("openStaff").addEventListener("click", openDrawer);
document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
drawerBg.addEventListener("click", closeDrawer);

function renderStaffPanel(){
  drawerContent.innerHTML = `
    <h2>Área da loja</h2>
    <p style="color:var(--ink-soft);font-size:.88rem;line-height:1.5;margin:4px 0 18px;">
      Registrar venda e ver patrimônio/comissão agora funcionam fora daqui, sem precisar de login nenhum nesta página.
    </p>
    <a class="staff-link-btn" href="${FORM_VENDA_URL}" target="_blank" rel="noopener">Registrar venda</a>
    ${PAINEL_URL
      ? `<a class="staff-link-btn secondary" href="${PAINEL_URL}" target="_blank" rel="noopener">Ver patrimônio e comissão</a>`
      : `<div class="status-box">Painel de patrimônio/comissão ainda não disponível.</div>`}
  `;
}
